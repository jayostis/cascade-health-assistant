name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # No model key is needed or set: the chat's tests run on the AI SDK's mock model, and the browser test never asks one.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # `npm test` writes report/junit.xml (test/spec-reporter.ts). The upload runs even when a test fails.
      - run: npm test
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests
          path: report/
          if-no-files-found: error
      - run: npm run build
      # A clone has no pods/: load them, as a person's `npm run reset` does, before the browser test starts the app.
      - run: npm run reset
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - id: install
        run: npx playwright install --only-shell chromium
      - uses: actions/cache/save@v6
        if: ${{ steps.install.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npm run test:e2e
